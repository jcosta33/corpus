# checks.yaml — the checks contract as data. Inert: nothing in this
# repository runs it.
#
# This file is the contract of record for deterministic checks and packet schemas.
# docs/reference/checks.md explains the same contract for humans and must agree with it.
# The human-facing artifact-shape reference is docs/reference/artifact-formats.md.
# Frontmatter lists are minimum-required: extra keys are legal and ignored.
# The reference consumer is suspec-cli's `suspec check` — an explicit-path
# checker whose primary artifacts and companions are explicit paths. Deterministic
# reference checks may read local paths those artifacts name. A reviewer can apply
# every rule by hand.
# The files under fixtures/ pin the expected results and guard this file and
# the prose from drifting apart.
#
# Severity legend:
#   hard-error  a checker must reject the file
#   warning     a checker should flag it; teams may treat any warning as
#               blocking by policy
# Severities are expressed at check time — exit codes are the API (0 clean ·
# 1 warning · 2 blocking); the human owns what blocks a merge.

version: 0.27.0 # contract version of this file

# --- Artifact and frontmatter contract ----------------------------------------
artifact_types:
  checked: [spec, task, change-plan, campaign]
  recognized_unchecked: [inventory, audit, research]
  missing_type: hard-error
  unknown_type: hard-error

check_reports:
  checked: [type, level, path, diagnostics]
  unchecked: [type, level, path, checked]
  unchecked_value: false
  file_set: [level, path, diagnostics]
  file_set_path: "(file set)"

frontmatter:
  opening_delimiter: first logical line after optional UTF-8 BOM
  closing_delimiter: required
  key_pattern: "[A-Za-z0-9_-]+"
  values: [string-scalar, inline-string-list, block-string-list]
  scalar_coercion: none
  comments: allowed outside quoted values
  allow_extra_keys: true
  common_scalar_fields: [type, id]
  reject:
    - duplicate keys
    - unbalanced quotes or brackets
    - nested maps or lists
    - multiline scalars
    - anchors, aliases, or tags
    - empty list heads
    - scalar/list field-shape mismatches

# --- Spec form ----------------------------------------------------------------
# A spec is structured markdown: each requirement is a `### AC-NNN` heading followed by
# exactly one non-empty `- When:`, one non-empty `- Then:`, and one `- Verify with:`
# item in that order. C003 owns a missing Verify value.
# Field-shape lists below apply when a field is present.
# Separate checks state presence and non-empty requirements.
spec_form:
  frontmatter:
    scalar: [type, id, title, status, owner]
    list: [sources]
  status_enum: [draft, ready]
  invalid_option_value: hard-error

# --- Core checks ---------------------------------------------------------------
# Mirrors the "Core checks" table in docs/reference/checks.md, row for row.
# C001–C009, C015, and C019 key on the spec; C010–C011 key on the change plan;
# C002 keys on the file set passed in one invocation (frontmatter id uniqueness across the checked files);
# C012 is RESERVED. Never reuse.
# C013 is RESERVED. Never reuse.
# C015 keys the spec's inline [[KEY]] citations against the <a id> anchors in the sources.md its
# frontmatter names, resolved against the spec's own directory.
# Reference resolution is ARTIFACT-RELATIVE everywhere: a ref resolves against the artifact that
# names it, never against a surrounding tree.
# IDs are stable. This list owns each deterministic id, name, and severity; the prose reference
# explains each rule in full.
core_checks:
  - { id: C001, name: unique-ids, severity: hard-error }
  - { id: C002, name: duplicate-id, severity: hard-error } # frontmatter id uniqueness across files checked together; requirement ids are spec-scoped
  - { id: C003, name: verify-with, severity: hard-error }
  - { id: C004, name: one-strength-word, severity: hard-error } # exactly one binding word in the requirement's Then value
  - { id: C007, name: no-tbd-at-ready, severity: hard-error } # open questions not marked non-blocking included
  - { id: C008, name: sources-named, severity: warning }
  - { id: C009, name: broken-source-link, severity: hard-error } # path-shaped refs only, resolved against the spec's own directory (artifact-relative); bare tracker ids exempt
  - { id: C010, name: preserves-refs-resolve, severity: hard-error } # change plan: preserves: + guarantee-table ids resolve (PG-NNN = plan-local); SPEC-x#AC-NNN refs resolve against the plan's sibling specs
  - { id: C011, name: waves-present, severity: warning } # change plan: kind in {migration, rewrite, schema-change} => non-empty waves, each naming a verify step
  # C012 is RESERVED. Never reuse.
  # C013 is RESERVED. Never reuse.
  # C014 is RESERVED. Live-diff inspection remains outside deterministic checking. Never reuse.
  - { id: C015, name: citation-resolves, severity: warning } # inline [[KEY]] resolves to <a id="KEY"> in the named artifact-relative sources.md; skips when no sources.md resolves
  # C016 is RESERVED. Never reuse.
  # C017 is RESERVED. Never reuse.
  # C018 is RESERVED. Never reuse.
  - { id: C019, name: malformed-requirement-heading, severity: warning } # a ### id with lowercase split suffix (AC-004a) parses as prose and vanishes from scope; requirement ids are digits-only
  # C020 is RESERVED. Never reuse.
  - { id: C021, name: intent-present, severity: hard-error } # spec: a non-empty ## Intent section
  - { id: C022, name: task-shape, severity: hard-error } # task: field shapes, status enum, and required H2 sections
  - { id: C023, name: task-evidence, severity: hard-error } # task: review-ready/closed ## Verify has numeric exit + non-empty fenced raw output, a visible `CI:`/`CI link:` URL, or justified n/a; ready/running are exempt; exact claim-only fences and placeholders fail
  - { id: C024, name: closed-task-resolved, severity: hard-error } # task: status closed has no non-empty canonical blocking label under an unordered or ordered list item except none/n/a
  - { id: C025, name: spec-shape, severity: hard-error } # spec: non-empty id, draft/ready status, exactly one Intent and Requirements section, and at least one requirement
  # C026 is RESERVED. Never reuse.
  # C027 is RESERVED. Never reuse.
  - { id: C028, name: requirement-shape, severity: hard-error } # spec: non-empty When and Then plus one Verify with list item in order, with no other live body line; C003 owns an empty Verify value
  - { id: C029, name: campaign-shape, severity: hard-error } # campaign: frontmatter and required H2 sections are structurally valid
  - { id: C030, name: campaign-authority, severity: hard-error } # campaign: local ledger/source refs resolve artifact-relative; no duplicated Markdown task-list state
  - { id: C031, name: campaign-ready, severity: hard-error } # campaign: ready status carries no unresolved blocking decision
  # C005 and C006 are RESERVED. Never reuse.

# --- The task packet -----------------------------------------------------------
# The task packet's required shape (the human-facing reference is
# docs/reference/artifact-formats.md): a well-formed task presents every
# required H2 section and satisfies every content rule.
task_file:
  frontmatter:
    scalar: [type, id, status]
    list: [source, scope]
  type_value: task
  non_empty: [id, source, scope]
  source_contract: >-
    `source` names the spec that owns every scoped requirement. A change plan
    may be named as context in the Source section, but never replaces that spec.
    The source spec's status is exactly `ready` before the task is dispatched;
    `draft`, a missing status, and every other value block dispatch.
  status_enum: [ready, running, review-ready, closed]
  invalid_option_value: hard-error
  required_section_occurrence: exactly-once
  required_sections:
    - Source
    - Scope
    - Do not change
    - Affected areas
    - Verify
    - Agent instructions
    - Run order
    - Findings
    - Run summary # the handoff digest — cites the Verify pastes, never re-pastes them
  content_rules:
    - id: task-dependency-handoff # implemented by core check C022
      applies_to: Run order
      severity: hard-error
      rule: >-
        `Starts after:` and `May run with:` each carry a non-empty value. `None`
        is explicit and valid.
    - id: task-evidence # implemented as core check C023
      applies_to: Verify
      # The Run summary section cites these pastes — never an alternative paste home.
      severity: hard-error
      rule: >-
        When status is `review-ready` or `closed`, the Verify section contains a
        numeric exit status plus non-empty fenced raw command output, a visible
        URL labeled `CI:` or `CI link:`, or `n/a` with a one-line reason. Status
        `ready` and `running` do not run this evidence check. A fence is
        claim-only, and therefore not raw output, only when its entire trimmed
        body matches `^(all )?(tests?|checks?) (pass(ed)?|succeeded)\.?$`
        case-insensitively. A fence is an unfilled placeholder when its entire
        trimmed body matches `^(pending|tbd|todo|\?\?\?|\{\{[^}\r\n]+\}\})\.?$`
        case-insensitively; any such fence fails even when another fence has
        output. Non-fenced `pending`, `TBD`, `TODO`, `???`, and `{{...}}`
        placeholders fail case-insensitively, including inside inline code;
        other fenced command output remains untouched evidence.
    - id: closed-task-resolved # implemented as core check C024
      applies_to: whole packet (frontmatter status + every section)
      severity: hard-error
      rule: >-
        When status is `closed`, the packet contains no `TBD`, `TODO`, `???`, or
        non-empty canonical blocking label after an unordered (`-`, `*`, `+`) or
        ordered (`N.`) list marker: `Blocked questions:`, `Blocking:`, or
        `Open question (blocking):`. The values `none` and `n/a`, matched
        case-insensitively after trimming, are resolved and do not fail. HTML
        comments and fenced output are excluded; inline code remains live text.

# --- The campaign goal ---------------------------------------------------------
campaign_file:
  frontmatter:
    scalar: [type, id, status, ledger]
    list: [sources]
  type_value: campaign
  non_empty: [id, ledger, sources]
  status_enum: [draft, ready]
  invalid_option_value: hard-error
  required_section_occurrence: exactly-once
  required_sections:
    - Objective
    - Completion contract
    - Authorities
    - Operating loop
    - Stops
  content_rules:
    - id: campaign-shape # implemented by core check C029
      severity: hard-error
      rule: >-
        Frontmatter fields have the declared shapes; id, ledger, and sources are non-empty; status
        is draft or ready; and every required H2 section appears exactly once with non-empty body.
    - id: campaign-authority # implemented by core check C030
      severity: hard-error
      rule: >-
        A URL is external. Every path-shaped local ledger or source reference is relative to the
        campaign and resolves to a file. Absolute local references fail. The body contains no
        Markdown task-list checkbox; mutable progress belongs to the named project ledger.
    - id: campaign-ready # implemented by core check C031
      severity: hard-error
      rule: >-
        At status ready, visible body text contains no TBD, TODO, ???, or non-empty canonical
        blocking label. Fenced output and HTML comments are excluded; inline code remains live.

# --- The change plan -----------------------------------------------------------
change_plan_file:
  frontmatter:
    scalar: [type, id, title, status, kind, owner]
    list: [sources, preserves]

# --- Command slots (advisory) ----------------------------------------------------
# Adapter slots a Verify item or `Verify with:` line may name instead of a
# literal command; each resolves through the repo's `AGENTS.md > Commands`
# table. Advisory: no slot is required, and absence never fails a check.
commands:
  level: advisory
  slots:
    [
      cmdInstall,
      cmdBuild,
      cmdTest,
      cmdLint,
      cmdTypecheck,
      cmdFormat,
      cmdValidate,
      cmdBenchmark,
      cmdSecurity,
    ]
  rule: >-
    A named slot with no Commands row resolves to nothing — the claim it backs
    reviews as Unverified until a real command and its pasted output exist.

# --- Placeholder namespaces -------------------------------------------------------
# Who owns which placeholder prefix in templates and packets. A tool leaves
# every prefix it does not recognize untouched.
placeholders:
  namespaces:
    - prefix: "cmd"
      owner: this contract
      rule: reserved for the adapter slots above; a new cmd* name lands in this file first
    - prefix: "project:"
      owner: the adopting repo
      rule: consumer-owned; this contract never assigns it meaning
    - prefix: "<vendor>:"
      owner: any tool vendor
      rule: any other namespaced prefix is a legal vendor extension, left untouched

# --- Fixtures ----------------------------------------------------------------------
# Where the pinned expectations live. See ./README.md for the map and the
# per-domain fixtures.
fixtures:
  positive: fixtures/conformant-task.md
  negative: fixtures/violations.md
  domains: [fixtures/auth-refresh, fixtures/payment-5xx, fixtures/checkout]
  transformation: fixtures/transformation # inventory + change plan; EXPECTED.md pins C010/C011
  cross-folder-source: fixtures/cross-folder-source # EXPECTED.md pins C009 artifact-relative resolution across folders
