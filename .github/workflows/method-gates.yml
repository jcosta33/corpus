name: method-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - { uses: actions/checkout@v4, with: { fetch-depth: 0 } }

      - name: Repository gates
        env:
          SUSPEC_HISTORY_BASE: "${{ github.event.pull_request.base.sha || github.event.before }}"
        run: sh scripts/lint-all.sh
